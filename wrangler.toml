name = "jeweler-site"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/img/*"]

[[d1_databases]]
binding = "DB"
database_name = "jeweler-db"
database_id = "9dac0e49-59ca-411c-80c6-9195c5950a01"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "jeweler-media"        # wrangler r2 bucket create jeweler-media

# The autopilot: ONE hourly cron (free plan allows 5 per account).
# src/agents/scheduler.ts decides which jobs run each hour.
[triggers]
crons = ["0 * * * *"]

[vars]
STORE_NAME = "GLINT"
CURRENCY = "usd"
DEFAULT_MARKUP = "3.2"
AUTO_PUBLISH = "false"   # true = autopilot lists without human approval

# Secrets (wrangler secret put NAME):
# APIFY_TOKEN, OPENAI_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# ALIEXPRESS_APP_KEY, ALIEXPRESS_APP_SECRET, ALIEXPRESS_ACCESS_TOKEN,
# CJ_API_KEY, ADMIN_BOOTSTRAP_EMAIL, ADMIN_BOOTSTRAP_PASSWORD

<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLINT HQ</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b14;--panel:#17141f;--line:#2a2535;--ink:#f6f3ff;--muted:#a29cba;--lime:#d8ff5c;--pink:#ff9ad5;--lilac:#c9b8ff;--red:#ff6b6b}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,sans-serif}
h1,h2,.logo{font-family:Unbounded;letter-spacing:-.03em}
.wrap{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
aside .logo{font-size:20px;margin:0 10px 22px}aside .logo span{color:var(--lime)}
aside a{padding:9px 12px;border-radius:10px;color:var(--muted);cursor:pointer}aside a.on,aside a:hover{background:var(--panel);color:var(--ink)}
main{padding:28px;overflow:auto}h2{font-size:24px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.kpi b{display:block;font:800 26px Unbounded;margin-top:4px}.kpi small{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;overflow-x:auto}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase}
td img{width:44px;height:44px;object-fit:cover;border-radius:8px}
button,.b{background:var(--lime);color:#0d0b14;border:0;border-radius:99px;padding:7px 14px;font:600 13px Inter;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.red{background:var(--red)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--line)}.pill.ok,.pill.active{background:#2d4a12;color:var(--lime)}.pill.error,.pill.needs_manual{background:#4a1616;color:var(--red)}
.jobs{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lilac),var(--pink))}
input,textarea,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;width:100%}
label{display:block;margin:12px 0 6px;color:var(--muted)}
.login{max-width:360px;margin:15vh auto;background:var(--panel);padding:32px;border-radius:20px;border:1px solid var(--line)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.cgrid .panel img{width:100%;border-radius:10px;aspect-ratio:1;object-fit:cover;margin-bottom:10px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}aside .logo{display:none}}
</style></head>
<body><div id="root"></div><script src="/admin/admin.js" type="module"></script></body></html>

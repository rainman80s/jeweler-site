name: Deploy to Cloudflare

on:
  push:
    branches: [main, claude/wonderful-albattani-zfq49z]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Elias's account. Falls back to CLOUDFLARE_API_TOKEN once that secret is updated to his token.
      CLOUDFLARE_API_TOKEN: ${{ secrets.NEW_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the Cloudflare key is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Update database tables (safe to re-run)
        run: npm run db:init
      - name: Deploy
        run: ./scripts/deploy.sh
